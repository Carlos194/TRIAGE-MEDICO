name: Apply institutional print form v2
on:
  push:
    paths:
      - '.github/workflows/apply-print-form-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link new print stylesheet and refresh logo assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<link rel="stylesheet" href="logo-fix.css?v=20260731-3">'
          if old not in s:
              old='<link rel="stylesheet" href="logo-fix.css?v=20260731-1">'
          tag='<link rel="stylesheet" href="print-form-v2.css?v=20260731-1">'
          if tag not in s:
              if old in s:
                  s=s.replace(old, old+'\n'+tag)
              else:
                  s=s.replace('</head>', tag+'\n</head>')
          s=s.replace("logo=t[1]?`<img src=\"${t[1]}\">`", "logo=t[1]?`<img class=\"institution-logo institution-${v.institution||p.institution||'default'}\" src=\"${t[1]}?v=20260731-2\" alt=\"Logo institucional\">`")
          s=s.replace("headerLogo.innerHTML=t[1]?`<img src=\"${t[1]}\">`", "headerLogo.innerHTML=t[1]?`<img class=\"institution-logo institution-${p.institution||'default'}\" src=\"${t[1]}?v=20260731-2\" alt=\"Logo institucional\">`")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply institutional print form for IMSS ISSSTE and IMSS-Bienestar"
          git push
