name: Fix birth date mask

on:
  push:
    paths:
      - '.github/workflows/fix-birth-mask.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore DD/MM/AAAA mask
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "birth.oninput=calcAge;coverage.onchange=syncCoverage;"
          new = """birth.setAttribute('inputmode','numeric');birth.setAttribute('maxlength','10');birth.oninput=e=>{const digits=e.target.value.replace(/\\D/g,'').slice(0,8);let formatted=digits;if(digits.length>2)formatted=digits.slice(0,2)+'/'+digits.slice(2);if(digits.length>4)formatted=digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);e.target.value=formatted;calcAge()};coverage.onchange=syncCoverage;"""
          if old not in text:
              raise SystemExit('Expected birth handler was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix automatic birth date slashes"
          git push
